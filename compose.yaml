services:
  db:
    image: postgres:17-alpine
    container_name: whole-platport-db
    environment:
      POSTGRES_DB: wpl
      POSTGRES_USER: wpl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env (copia .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data # los datos sobreviven a "docker compose down"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wpl -d wpl"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Solo accesible desde tu máquina (psql, DBeaver, pruebas); no desde la red. Cambia DB_PORT si 5432 está ocupado.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    restart: unless-stopped

  app:
    build: .
    image: whole-platport-lite:latest
    container_name: whole-platport-lite
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      # Inicio de sesión (RN-10). Se leen de .env; ver .env.example.
      AUTH_USERNAME: ${AUTH_USERNAME:?Define AUTH_USERNAME en .env (copia .env.example)}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?Define AUTH_PASSWORD en .env}
      AUTH_SECRET: ${AUTH_SECRET:?Define AUTH_SECRET en .env (32+ caracteres)}
      # Base de datos (RN-11). "db" es el nombre del servicio de arriba dentro de la red de Compose.
      DATABASE_URL: postgres://wpl:${POSTGRES_PASSWORD}@db:5432/wpl
    restart: unless-stopped

volumes:
  pgdata:
