name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@12.3.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t whole-platport-lite:ci .
      - name: Arranque y respuesta HTTP
        run: |
          docker run -d --name wpl -p 3000:3000 whole-platport-lite:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:3000/ >/dev/null && break; sleep 1; done
          for r in / /estrategias /riesgo /decisiones /copiloto /pruebas; do
            curl -fs -o /dev/null http://127.0.0.1:3000$r || exit 1
            echo "OK $r"
          done
          curl -fs http://127.0.0.1:3000/pruebas | grep -q "PA-01"
      - name: Logs del contenedor
        if: always()
        run: docker logs wpl || true
